spring:
  application:
    name: casacrew-backend

  profiles:

    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    # DB_URL wint als 'ie gezet is; anders opgebouwd uit losse
    # host/port/database-vars (zo kan Render's Postgres-add-on rechtstreeks
    # zijn eigen connectiegegevens invullen zonder een kant-en-klare
    # jdbc:-URL te hoeven leveren).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:casacrew}}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  flyway:
    # Vangnet voor een Postgres-instantie die niet letterlijk leeg is (bv.
    # eigen standaardobjecten van de hostingprovider in het public-schema)
    # maar ook geen van onze eigen tabellen bevat -- baseline-version 0 zegt
    # dan terecht "niets hiervan is al toegepast". Lost GEEN scenario op
    # waarbij de app-tabellen zelf al (deels) bestaan zonder geregistreerde
    # geschiedenis -- dat vraagt om een expliciete, bewuste keuze (schema
    # resetten of een preciezere baseline-version), niet om een aanname hier.
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:0}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

seed:
  enabled: ${SEED_ENABLED:false}
  admin:
    email: ${SEED_ADMIN_EMAIL:}
    password: ${SEED_ADMIN_PASSWORD:}
  cleaner:
    email: ${SEED_CLEANER_EMAIL:}
    password: ${SEED_CLEANER_PASSWORD:}
  student:
    emails: ${SEED_STUDENT_EMAILS:}
    password: ${SEED_STUDENT_PASSWORD:}

logging:
  level:
    org.hibernate.SQL: WARN
    org.springframework.security: INFO

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://*.vercel.app,https://*.netlify.app,https://casacrew.nl,https://www.casacrew.nl}
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@casacrew.nl}}
    bcc:
      admin: ${MAIL_BCC_ADMIN:}
  rent:
    amount: ${RENT_AMOUNT:350.00}
  password-reset:
    expiry-minutes: ${PASSWORD_RESET_EXPIRY_MINUTES:30}
  auth:
    session-expiry-seconds: ${SESSION_EXPIRY_SECONDS:3600}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  whatsapp:
    from: ${TWILIO_WHATSAPP_FROM:}

