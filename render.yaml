databases:
  - name: rentit-db
    plan: free
    databaseName: rentit
    user: rentit

services:
  - type: web
    name: rentit-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: rentit-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: rentit-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: rentit-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: rentit-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: rentit-db
          property: password
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,https://*.netlify.app,http://localhost:5173"
