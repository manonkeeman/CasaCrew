databases:
  - name: casacrew-db
    plan: 0.1c-256mb
    databaseName: casacrew_db
    user: casacrew_db_user

services:
  - type: web
    name: casacrew-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: casacrew-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: casacrew-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: casacrew-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: casacrew-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: casacrew-db
          property: password
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,https://*.netlify.app,http://localhost:5173,https://casacrew.nl,https://www.casacrew.nl"
