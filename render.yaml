databases:
  - name: casacrew-db
    plan: 0.1c-256mb
    databaseName: casacrew_db
    user: casacrew_db_user

services:
  - type: web
    name: casacrew-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    healthCheckPath: /actuator/health
    # Forceer een nieuwe Blueprint-sync zodat Render de disk hieronder opnieuw probeert
    # aan te maken nu het compute-plan is geupgraded (eerdere sync faalde nog op Free-plan).
    disk:
      name: casacrew-uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: casacrew-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: casacrew-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: casacrew-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: casacrew-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: casacrew-db
          property: password
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://casacrew.nl,https://www.casacrew.nl,https://casacrew.netlify.app,http://localhost:5190"
